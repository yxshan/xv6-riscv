name: xv6 tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpus: [1, 3]
    env:
      TOOLPREFIX: riscv64-linux-gnu-
      CPUS: ${{ matrix.cpus }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc

      - name: Host checks
        run: python3 tools/check-tests.py

      - name: Build
        run: |
          make clean
          make kernel/kernel fs.img

      - name: User tests
        run: ./test-xv6.py -q usertests

      - name: Tool tests
        run: ./test-xv6.py tools

      - name: Grind stress
        run: ./test-xv6.py grind

      - name: Module tests
        run: ./test-xv6.py modules

      - name: Crash tests
        run: ./test-xv6.py crash

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xv6-test-output
          path: test-xv6.out
