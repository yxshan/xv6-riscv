name: xv6 tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TOOLPREFIX: riscv64-linux-gnu-
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc

      - name: Build
        run: |
          make clean
          make kernel/kernel fs.img

      - name: User tests
        run: ./test-xv6.py -q usertests

      - name: Tool tests
        run: ./test-xv6.py tools

      - name: Module tests
        run: ./test-xv6.py modules

      - name: Crash tests
        run: ./test-xv6.py crash
